<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        background: #121212;
        color: #e0e0e0;
      }

      h3 {
        color: #ffffff;
        text-align: center;
        margin-bottom: 20px;
        font-size: 20px;
      }

      input {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border: 1px solid #555;
        border-radius: 6px;
        background-color: #1e1e1e;
        color: #fff;
        margin-bottom: 15px;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #4A90E2;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #357ABD;
      }

      #msg {
        font-weight: bold;
        margin: 10px 0;
      }

      .preview {
        margin-top: 20px;
        padding: 15px;
        background: #1e1e1e;
        border-radius: 10px;
        border: 1px solid #333;
        max-height: 500px;
        overflow-y: auto;
        color: #ddd;
      }

      .section {
        margin-bottom: 15px;
        padding-bottom: 8px;
        border-bottom: 1px dashed #444;
      }

      .section strong {
        color: #ffffff;
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        font-size: 15px;
      }

      .section:last-child {
        border-bottom: none;
      }

      .preview::-webkit-scrollbar {
        width: 10px;
      }

      .preview::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      .preview::-webkit-scrollbar-thumb {
        background-color: #ffffff;
        border-radius: 10px;
      }

      .preview::-webkit-scrollbar-thumb:hover {
        background-color: #cccccc;
      }
    </style>
  </head>
  <body>
    <h3>✨ AI Content Marketing Automation System</h3>

    <input type="text" id="keyword" placeholder="Enter a keyword like AI in Finance" />

    <button onclick="submitForm()">🚀 Generate Blog</button>

    <div id="msg"></div>

    <div id="preview" class="preview"></div>

    <script>
      function submitForm() {
        const keyword = document.getElementById('keyword').value.trim();
        if (!keyword) return alert("❗ Please enter a keyword.");

        document.getElementById("msg").textContent = "⏳ Generating content...";
        document.getElementById("msg").style.color = "#e0e0e0";
        document.getElementById("preview").innerHTML = "";

        google.script.run.withSuccessHandler(displayContent).handleFormInput(keyword);
      }

      function displayContent(response) {
        const msgBox = document.getElementById("msg");
        const preview = document.getElementById("preview");

        if (response.error) {
          msgBox.style.color = "red";
          msgBox.textContent = response.error;
          preview.innerHTML = "";
          return;
        }

        msgBox.style.color = "#00ff88";
        msgBox.textContent = "✅ Blog content generated and saved to Google Sheet.";

        const fields = [
          "Blog Title", "Slug", "Introduction",
          "Paragraph 1", "Paragraph 2", "Paragraph 3",
          "Paragraph 4", "Paragraph 5", "Conclusion",
          "FB Caption", "Insta Caption", "Hashtags",
          "Twitter Post", "Image Link"
        ];

        const html = response.data.map((val, i) =>
          `<div class="section"><strong>${fields[i]}:</strong> ${val}</div>`
        ).join("");

        preview.innerHTML = html;
      }
    </script>
  </body>
</html>
